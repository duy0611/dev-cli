name: Go cache
description: >-
  The module and build caches setup-go kept. mise-action caches only the
  toolchain, so without this every run downloads and compiles from scratch.

runs:
  using: composite
  steps:
    # From go env, not hard-coded: GOCACHE is under ~/Library/Caches on macOS.
    - id: dirs
      shell: bash
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v5
      with:
        path: |
          ${{ steps.dirs.outputs.build }}
          ${{ steps.dirs.outputs.mod }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.dirs.outputs.version }}-${{ hashFiles('go.sum') }}
        restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.dirs.outputs.version }}-
