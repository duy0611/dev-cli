## Opens a release PR from the commits on main, and on its merge tags the
## release and builds `dev` for every platform it runs on.
##
## release-please reads Conventional Commit subjects since the last release,
## keeps a PR open that bumps .release-please-manifest.json and CHANGELOG.md,
## and when that PR merges, creates the tag and the GitHub release. The build
## lives in this same workflow rather than one triggered by the tag: a tag
## pushed with GITHUB_TOKEN starts no other workflow, so a separate `on: push:
## tags` would never run.
##
## `dev` is a host-side tool: it shells out to the devcontainer CLI, docker and
## kubectl, and reads the macOS Keychain. So it is built for the machines an
## operator sits at, which is not the same set as the relay's — that one runs
## inside a Linux container and is always linux/amd64 and linux/arm64, both of
## which are embedded in every binary here.
name: Release

on:
  push:
    branches: [main]
  # Runnable by hand so the build can be proved before a release exists, which
  # is the only way to find out that a cross-build is broken without publishing
  # a broken release first.
  workflow_dispatch:

# Two merges in quick succession must not race to open or update the same PR.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # the tag, the release, and uploading to it
  pull-requests: write # opening and updating the release PR

jobs:
  release-please:
    # A manual run is for proving the build, not for touching the release PR.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    # always(), because on a manual run release-please is skipped and a skipped
    # need would otherwise skip this too. On a push it builds only when the
    # merge being pushed was the release PR's.
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.release-please.outputs.created == 'true')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Checked out at the tag release-please just created, so the binaries
          # are built from exactly the commit the release names.
          ref: ${{ needs.release-please.outputs.tag || github.ref }}
          # The Makefile stamps the version from `git describe`, which reads
          # tags. A shallow clone has none, and every binary would call itself
          # the same thing.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The whole point of a release build: the tests must pass for the commit
      # being published, not merely for the commit CI last looked at.
      - name: Test
        run: make build && make test

      - name: Build every platform
        run: |
          set -eu
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
          else
            version="$(git describe --tags --always)"
          fi
          mkdir -p release

          # The relay is built once. It is linux-only whatever the host is,
          # because it runs inside a container — and it is the same two binaries
          # embedded into all four of the below.
          make relay

          for platform in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os="${platform%/*}"
            arch="${platform#*/}"
            echo "==> $os/$arch"
            # CGO off, as the Makefile does: the SQLite driver is pure Go, so
            # every one of these is a static binary with no C toolchain in
            # sight. That is what makes cross-building all four here possible.
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=$version" \
              -o "release/dev" ./cmd/dev
            tar -czf "release/dev_${version}_${os}_${arch}.tar.gz" -C release dev
            rm release/dev
          done

          # Checksums, so a download can be verified. Generated in the
          # directory so the file names in it are bare rather than paths.
          cd release && sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # The release already exists, with release-please's changelog as its
      # notes; this only adds the files to it.
      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/*.tar.gz release/SHA256SUMS --clobber

      # On a manual run there is no release to attach to, so the binaries are
      # kept as an artefact instead. That is what makes the dispatch trigger
      # useful: the cross-build is proved, and nothing is published.
      - name: Keep the binaries when there is no release
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: dev-binaries
          path: release/
