## Runs what `make lint && make test` and `make smoke` run locally, and nothing
## else.
##
## The point is that a green tick means the same thing as a clean local run — so
## this file installs the tools and calls the Makefile targets, rather than
## restating the commands. A check that drifts from the Makefile is worse than no
## check: it fails on things the operator cannot reproduce, or passes on things
## that are broken.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides whether the change can affect what the checks below test, so a
  # prose-only change does not spend twenty runner-minutes proving nothing.
  #
  # Not a `paths:` filter on the trigger: a required check whose workflow never
  # starts never reports, and a docs-only PR would wait on it forever. The
  # workflow always runs; the expensive jobs skip, and ci_success_check below
  # counts a skip as a pass.
  #
  # An allowlist of what may be skipped rather than of what triggers: anything
  # not named here runs the checks. The *.md and plan/spec prose is all that is
  # safe — docs/agents.sample.yaml is test input (agentcfg_test loads it), and a
  # non-Go file added later should not be able to dodge CI by default.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Enough history to diff a pull request against its base, or a push
          # against the commit before it.
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          # A push that created the branch, or a history git cannot diff
          # against, has no base worth trusting: run everything.
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base; running every check"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          code=$(echo "$changed" | grep -vE '\.md$|^docs/(plans|specs)/' || true)
          if [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "prose only; skipping the checks"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # On both the operator's platforms: Linux on amd64, and macOS on Apple
  # Silicon, which is where `dev` is mostly run. The keychain backend, path
  # resolution (invariant 2) and the stub-executable harness all touch the host
  # OS, so a pass on Linux says nothing about darwin.
  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      # One platform failing is no reason to stop learning about the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # From go.mod, so the toolchain is not pinned in two places and
          # cannot disagree with what the module requires.
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned: a new release adds linters, which would fail a tree that
          # was clean when it was pushed. Raise it deliberately.
          version: v2.13.2
          # The action runs golangci-lint itself; `make lint` also runs gofmt
          # and go vet, which the next step covers.
          args: --timeout 5m

      - name: gofmt and vet
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; echo "run: gofmt -w ."; exit 1; fi
          go vet ./...

      # Builds the relay for both architectures, then dev with them embedded.
      # Before the tests, because a test asserts the embedded relay is a real
      # ELF executable and skips when it is absent — so without this the check
      # that the cross-build works would quietly not run.
      - name: Build
        run: make build

      - name: Test
        run: make test

  # The local-provider half of `make smoke`, against the runner's own Docker.
  # A job of its own, not a step after Test, so its image pulls and feature
  # builds run beside the check above rather than after it.
  #
  # The Kubernetes half skips here: it needs DEV_SMOKE_K8S_CONTEXT and
  # DEV_SMOKE_REGISTRY, and this workflow has no cluster or registry to name.
  #
  # Linux on both architectures, not macOS: GitHub's macOS runners are Apple
  # Silicon VMs without nested virtualisation, so no container engine starts on
  # them, and every smoke test would skip and go green having tested nothing.
  # What an Apple Silicon laptop runs inside its engine's VM is linux/arm64, and
  # that is what the arm runner exercises — arm64 images, features, and the
  # arm64 build of the embedded relay.
  smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # Generous, because the first create pulls images and builds features over
    # the network; a hang should still end rather than hold a runner for six
    # hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Both Ubuntu images ship Docker with buildx and Node with npm, but not the
      # devcontainer CLI. Without it every smoke test skips and the job goes
      # green having tested nothing.
      - name: Install the devcontainer CLI
        run: npm install -g @devcontainers/cli

      # The smoke tests compile cmd/dev themselves; the relay has to be there
      # first or that binary embeds none.
      - name: Build the relay
        run: make relay

      - name: Smoke
        run: make smoke

  # The one check to mark Required in branch protection, so the matrix can
  # change shape without the protection rule naming jobs that no longer exist.
  #
  # always(), or it would be skipped whenever a job it needs failed — and a
  # skipped required check counts as passing, which is the opposite of the
  # point. Success and skipped pass (skipped is a prose-only change); failure
  # and cancelled do not, nor does the change detection failing, since then
  # nothing decided the checks could be skipped.
  ci_success_check:
    if: always()
    needs: [changes, check, smoke]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[]
            | select(.key == "changes" and .value.result != "success"
                  or .key != "changes" and (.value.result | IN("success", "skipped") | not))
            | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::not passed: $bad"
            exit 1
          fi
