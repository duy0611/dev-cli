## Runs what `make lint && make test` and `make smoke` run locally, and nothing
## else.
##
## The point is that a green tick means the same thing as a clean local run — so
## this file installs the tools and calls the Makefile targets, rather than
## restating the commands. A check that drifts from the Makefile is worse than no
## check: it fails on things the operator cannot reproduce, or passes on things
## that are broken.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # From go.mod, so the toolchain is not pinned in two places and
          # cannot disagree with what the module requires.
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned: a new release adds linters, which would fail a tree that
          # was clean when it was pushed. Raise it deliberately.
          version: v2.13.2
          # The action runs golangci-lint itself; `make lint` also runs gofmt
          # and go vet, which the next step covers.
          args: --timeout 5m

      - name: gofmt and vet
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; echo "run: gofmt -w ."; exit 1; fi
          go vet ./...

      # Builds the relay for both architectures, then dev with them embedded.
      # Before the tests, because a test asserts the embedded relay is a real
      # ELF executable and skips when it is absent — so without this the check
      # that the cross-build works would quietly not run.
      - name: Build
        run: make build

      - name: Test
        run: make test

  # The local-provider half of `make smoke`, against the runner's own Docker.
  # A job of its own, not a step after Test, so its image pulls and feature
  # builds run beside the check above rather than after it.
  #
  # The Kubernetes half skips here: it needs DEV_SMOKE_K8S_CONTEXT and
  # DEV_SMOKE_REGISTRY, and this workflow has no cluster or registry to name.
  smoke:
    runs-on: ubuntu-latest
    # Generous, because the first create pulls images and builds features over
    # the network; a hang should still end rather than hold a runner for six
    # hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # ubuntu-latest ships Docker with buildx and Node with npm, but not the
      # devcontainer CLI. Without it every smoke test skips and the job goes
      # green having tested nothing.
      - name: Install the devcontainer CLI
        run: npm install -g @devcontainers/cli

      # The smoke tests compile cmd/dev themselves; the relay has to be there
      # first or that binary embeds none.
      - name: Build the relay
        run: make relay

      - name: Smoke
        run: make smoke
