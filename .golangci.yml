version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused

  settings:
    errcheck:
      # Cleanup on a path that has either finished or already failed. The error
      # has nothing to say that the caller can act on, and checking it would
      # bury the real failure under noise.
      exclude-functions:
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close

formatters:
  enable:
    - gofmt
